<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dictionary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>AI Dictionary</h1>
            <p class="subtitle">A collection of AI keywords, buzzwords, and terms</p>
        </header>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search terms..."
                class="search-input"
            >
        </div>

        <div class="terms-container">
            <div class="term-card">
                <h3 class="term-title">Term Name</h3>
                <p class="term-definition">Definition goes here...</p>
                <p class="term-example"><strong>Example:</strong> Example text here...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
